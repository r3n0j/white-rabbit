[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "white-rabbit"
version = "0.2.0"
description = "Follow the white rabbit: merge requests, notes and to-do of a Claude Code session, in its statusline."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
white-rabbit = "white_rabbit.cli:main"
rabbit = "white_rabbit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
